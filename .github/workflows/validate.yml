name: Validate catalog

on:
  push:
    paths:
      - "catalog/**"
      - "scripts/build_release.py"
      - "tools/validate_catalog.py"
      - "tools/build_demo.py"
      - "tools/generate_texture_maps.py"
      - "tools/generate_material_previews.py"
      - "package.json"
      - "tools/audit_missing_colors.py"
      - "tools/audit_brand_coverage.py"
      - "demo/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "catalog/**"
      - "scripts/build_release.py"
      - "tools/validate_catalog.py"
      - "tools/build_demo.py"
      - "tools/audit_brand_coverage.py"
      - "demo/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install 'jsonschema>=4.21,<5' 'numpy>=2,<3' 'Pillow>=11,<13' 'CairoSVG>=2.7,<3'
      - name: Validate sources, references, IDs and schemas
        run: python tools/validate_catalog.py
      - name: Unit-test colorimetry
        run: python -m unittest discover -s tests -v
      - name: Audit every unresolved PLA/PETG color
        run: |
          python tools/audit_missing_colors.py --format summary
          python tools/audit_missing_colors.py --format json --out dist/audit/unresolved.json
          python tools/audit_missing_colors.py --format markdown --out dist/audit/unresolved.md
      - name: Report coverage of every existing brand
        run: |
          python tools/audit_brand_coverage.py --format summary
          python tools/audit_brand_coverage.py --format json --out dist/audit/brand-coverage.json
          python tools/audit_brand_coverage.py --format markdown --out dist/audit/brand-coverage.md
      - uses: actions/upload-artifact@v4
        with:
          name: filamentra-catalog-quality-audits
          path: dist/audit/
          if-no-files-found: error
      - name: Check browser JavaScript syntax
        run: |
          node --check demo/app.js
          node --check demo/material-viewer.js
          node --check demo/optics.js
          node --test tests/test_optics.mjs
      - name: Regression-test catalog UI state and comparison
        run: node --test tests/demo_ux.test.mjs
      - name: Smoke-test preview build without deploying Pages
        run: |
          python tools/build_demo.py --out dist
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("dist/data/catalog.json").read_text(encoding="utf-8"))
          c = doc["meta"]["counts"]
          assert c["manufacturer_swatch"] > 0, c
          assert c["measured_samples"] > 0, c
          assert max(c["manufacturer_swatch"], c["measured_samples"]) <= c["curated_preview"] <= c["manufacturer_swatch"] + c["measured_samples"], c
          assert c["curated_preview"] + c["estimated"] + c["name_only"] == c["colors"], c
          assert c["colors"] == sum(len(line["colors"]) for line in doc["lines"]), c
          print("Preview quality gate passed:", c)
          PY
      - name: Build self-hosted WebGL viewer
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build:viewer
          test -s dist/assets/material-viewer.js
      - name: Verify PBR textures and gallery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root = Path("dist")
          items = json.loads((root / "data" / "textures.json").read_text(encoding="utf-8"))["items"]
          assert len(items) == len(list(Path("catalog/presets").glob("*.json"))) == 18
          assert (root / "textures.html").exists()
          for item in items:
              for key in ("normal_gl", "roughness_map", "preview"):
                  path = root / item[key]
                  assert path.is_file() and path.stat().st_size > 0, str(path)
                  with Image.open(path) as image:
                      image.verify()
              assert item["calibrated"] is False
          print(f"Validated {len(items)} procedural texture profiles")
          catalog = json.loads((root / "data/catalog.json").read_text(encoding="utf-8"))
          previews = [c["preview_image"] for line in catalog["lines"] for c in line["colors"] if "preview_image" in c]
          assert len(previews) == catalog["meta"]["counts"]["material_previews"], "preview count mismatch"
          assert len(previews) > 200, "unexpectedly few resolved previews"
          for name in previews:
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, str(path)
          assert (root / "assets/material-viewer.js").stat().st_size > 50000

          logo = root / "assets/brand/4fusionlab-logo.png"
          assert (root / "assets/brand/4fusionlab-logo.svg").is_file()
          assert logo.is_file()
          with Image.open(logo) as brand_image:
              assert brand_image.size == (512, 512)
              brand_image.verify()
          print(f"Validated {len(previews)} catalog-specific WebP previews")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: filamentra-typical-pbr-textures
          path: |
            dist/textures.html
            dist/data/textures.json
            dist/assets/presets/
          if-no-files-found: error

  changes:
    name: Check curated catalog changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.impact.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python scripts/release_changes.py --self-test
      - name: Detect distribution changes
        id: impact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: python scripts/release_changes.py --before "$BEFORE" --after "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  version:
    name: GitVersion 6.8.2
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate numeric version
        id: gitversion
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install GitVersion.Tool --tool-path "$RUNNER_TEMP/gitversion" --version 6.8.2
          version="$("$RUNNER_TEMP/gitversion/dotnet-gitversion" /showvariable MajorMinorPatch)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    name: Publish versioned catalog
    needs: [validate, version, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: filamentra-catalog-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, verify and publish immutable catalog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          python scripts/release_notes.py --product Filamentra-DataSource --version "$VERSION" --output "$RUNNER_TEMP/release-notes.md"
          python scripts/build_release.py --version "$VERSION"
          (cd dist && sha256sum -c "Filamentra-DataSource-$VERSION.zip.sha256")
          if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA" || {
              echo "Version tag already belongs to another commit: $tag" >&2
              exit 1
            }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag"
            exit 0
          fi
          gh release create "$tag" "dist/Filamentra-DataSource-$VERSION.zip" "dist/Filamentra-DataSource-$VERSION.zip.sha256" \
            --target "$GITHUB_SHA" --title "Filamentra-DataSource $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
