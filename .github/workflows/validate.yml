name: Validate catalog

on:
  push:
    paths:
      - "catalog/**"
      - "tools/validate_catalog.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "catalog/**"
      - "tools/validate_catalog.py"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install 'jsonschema>=4.21,<5'
      - name: Validate sources, references, IDs and schemas
        run: python tools/validate_catalog.py
