name: Build and publish catalog demo

# Deployment is intentionally manual to avoid automatic Pages builds on catalog commits.
on:
  workflow_dispatch:

concurrency:
  group: filamentra-catalog-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Validate, build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install "jsonschema>=4.21,<5" "numpy>=2,<3" "Pillow>=11,<13" "CairoSVG>=2.7,<3"
      - name: Validate all catalog entries
        run: python tools/validate_catalog.py
      - name: Check browser JavaScript syntax
        run: |
          node --check demo/app.js
          node --check demo/material-viewer.js
          node --check demo/optics.js
          node --test tests/test_optics.mjs
      - name: Regression-test catalog UI state and comparison
        run: node --test tests/demo_ux.test.mjs
      - name: Build snapshot from current main
        run: python tools/build_demo.py --out dist
      - name: Build self-hosted WebGL viewer
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build:viewer
          test -s dist/assets/material-viewer.js
      - name: Verify built snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("dist")
          doc = json.loads((root / "data/catalog.json").read_text(encoding="utf-8"))
          counts = doc["meta"]["counts"]
          assert counts["colors"] == sum(len(line["colors"]) for line in doc["lines"])
          assert counts["with_swatch"] + counts["name_only"] == counts["colors"]
          assert counts["brands"] > 0
          assert (root / "index.html").exists()
          assert (root / "assets/app.js").exists()
          assert (root / "assets/app.css").exists()
          assert (root / "assets/material-viewer.js").stat().st_size > 50000
          assert (root / "assets/brand/4fusionlab-logo.svg").is_file()
          logo = root / "assets/brand/4fusionlab-logo.png"
          assert logo.is_file()
          from PIL import Image
          with Image.open(logo) as logo_image:
              assert logo_image.size == (512, 512)
              logo_image.verify()
          previews = [c["preview_image"] for line in doc["lines"] for c in line["colors"] if "preview_image" in c]
          assert len(previews) == counts["material_previews"] and len(previews) > 200
          assert all((root / file).is_file() for file in previews)
          assert (root / "textures.html").exists()
          textures = json.loads((root / "data/textures.json").read_text(encoding="utf-8"))["items"]
          assert len(textures) == 18
          assert all((root / p[k]).is_file() for p in textures for k in ("normal_gl", "roughness_map", "preview"))
          print("Validated demo:", counts)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
